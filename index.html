<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .container {
        text-align: center;
      }

      h1 {
        color: white;
        margin-bottom: 20px;
        font-size: 3em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .scoreboard {
        display: flex;
        justify-content: space-around;
        margin-bottom: 30px;
        gap: 20px;
        flex-wrap: wrap;
      }

      .score-box {
        background: white;
        padding: 15px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .score-box label {
        display: block;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
        font-size: 0.9em;
      }

      .score-box span {
        display: block;
        font-size: 2em;
        color: #667eea;
        font-weight: bold;
      }

      .game-board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(10px);
      }

      .hole {
        width: 100px;
        height: 100px;
        background: url("assets/mole-hole.png") center/cover no-repeat;
        border-radius: 50%;
        position: relative;
        cursor: pointer;
        box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5),
          0 4px 8px rgba(0, 0, 0, 0.3);
        transition: transform 0.1s;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .hole:active {
        transform: scale(0.95);
      }

      .hole.active {
        background: url("assets/mole.png") center/cover no-repeat;
      }

      .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        padding: 12px 30px;
        font-size: 1.1em;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #startBtn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      #startBtn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      #startBtn:disabled {
        background: #999;
        cursor: not-allowed;
        opacity: 0.6;
      }

      #resetBtn {
        background: #ff6b6b;
        color: white;
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      }

      #resetBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
      }

      .difficulty-selector {
        margin-bottom: 20px;
      }

      .difficulty-selector label {
        color: white;
        margin-right: 15px;
        font-weight: bold;
        font-size: 1.1em;
      }

      .difficulty-selector select {
        padding: 8px 15px;
        border-radius: 5px;
        border: none;
        font-size: 1em;
        cursor: pointer;
        background: white;
        color: #333;
      }

      .game-over {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
        z-index: 1000;
      }

      .game-over h2 {
        font-size: 2.5em;
        color: #667eea;
        margin-bottom: 20px;
      }

      .game-over p {
        font-size: 1.3em;
        color: #333;
        margin-bottom: 10px;
      }

      .game-over .final-score {
        font-size: 2em;
        color: #764ba2;
        font-weight: bold;
        margin: 20px 0;
      }

      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
      }

      .overlay.show {
        display: block;
      }

      .game-over.show {
        display: block;
      }

      @media (max-width: 600px) {
        .game-board {
          gap: 10px;
        }

        .hole {
          width: 80px;
          height: 80px;
        }

        h1 {
          font-size: 2em;
        }

        .scoreboard {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔨 Whack-a-Mole 🔨</h1>

      <div class="difficulty-selector">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="scoreboard">
        <div class="score-box">
          <label>Score</label>
          <span id="score">0</span>
        </div>
        <div class="score-box">
          <label>Time</label>
          <span id="timer">30</span>
        </div>
        <div class="score-box">
          <label>Misses</label>
          <span id="misses">0</span>
        </div>
      </div>

      <div class="game-board" id="gameBoard">
        <!-- Holes will be generated here -->
      </div>

      <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOverModal">
      <h2>Game Over!</h2>
      <p>Final Score:</p>
      <div class="final-score" id="finalScore">0</div>
      <p id="missesSummary">Misses: 0</p>
      <button
        id="playAgainBtn"
        style="margin-top: 20px; background: #667eea; color: white"
      >
        Play Again
      </button>
    </div>

    <script>
      const GAME_DURATION = 30; // seconds
      const DIFFICULTIES = {
        easy: { duration: 2000 }, // 2 seconds
        normal: { duration: 1500 }, // 1.5 second
        hard: { duration: 1000 }, // 1 second
      };

      let gameState = {
        score: 0,
        timeLeft: GAME_DURATION,
        misses: 0,
        isGameRunning: false,
        activeMole: null,
        difficulty: "normal",
      };

      let timerId;
      let moleShowTimer;

      const gameBoard = document.getElementById("gameBoard");
      const scoreDisplay = document.getElementById("score");
      const timerDisplay = document.getElementById("timer");
      const missesDisplay = document.getElementById("misses");
      const startBtn = document.getElementById("startBtn");
      const resetBtn = document.getElementById("resetBtn");
      const difficultySelect = document.getElementById("difficulty");
      const gameOverModal = document.getElementById("gameOverModal");
      const overlay = document.getElementById("overlay");
      const finalScoreDisplay = document.getElementById("finalScore");
      const missesSummaryDisplay = document.getElementById("missesSummary");
      const playAgainBtn = document.getElementById("playAgainBtn");

      // Create holes
      function createHoles() {
        gameBoard.innerHTML = "";
        for (let i = 0; i < 9; i++) {
          const hole = document.createElement("div");
          hole.className = "hole";
          hole.id = `hole-${i}`;

          hole.addEventListener("click", () => {
            if (gameState.isGameRunning && hole.classList.contains("active")) {
              whackMole(hole);
            } else if (
              gameState.isGameRunning &&
              !hole.classList.contains("active")
            ) {
              gameState.misses++;
              missesDisplay.textContent = gameState.misses;
            }
          });

          gameBoard.appendChild(hole);
        }
      }

      function startGame() {
        gameState.isGameRunning = true;
        gameState.score = 0;
        gameState.misses = 0;
        gameState.timeLeft = GAME_DURATION;
        gameState.difficulty = difficultySelect.value;

        scoreDisplay.textContent = gameState.score;
        timerDisplay.textContent = gameState.timeLeft;
        missesDisplay.textContent = gameState.misses;

        startBtn.disabled = true;
        difficultySelect.disabled = true;

        // Start timer
        timerId = setInterval(() => {
          gameState.timeLeft--;
          timerDisplay.textContent = gameState.timeLeft;

          if (gameState.timeLeft <= 0) {
            endGame();
          }
        }, 1000);

        // Start showing moles
        showNextMole();
      }

      function showNextMole() {
        if (!gameState.isGameRunning) return;

        // Hide current active hole
        if (gameState.activeMole) {
          gameState.activeMole.classList.remove("active");
        }

        // Pick random hole
        const holes = document.querySelectorAll(".hole");
        const randomHole = holes[Math.floor(Math.random() * holes.length)];
        randomHole.classList.add("active");
        gameState.activeMole = randomHole;

        // Schedule next mole
        const difficulty = DIFFICULTIES[gameState.difficulty];
        moleShowTimer = setTimeout(showNextMole, difficulty.duration);
      }

      function whackMole(hole) {
        gameState.score++;
        scoreDisplay.textContent = gameState.score;
        hole.classList.remove("active");
        gameState.activeMole = null;

        // Add visual feedback
        hole.style.transform = "scale(0.9)";
        setTimeout(() => {
          hole.style.transform = "scale(1)";
        }, 100);
      }

      function endGame() {
        gameState.isGameRunning = false;
        clearInterval(timerId);
        clearTimeout(moleShowTimer);

        // Hide all active holes
        document.querySelectorAll(".hole").forEach((hole) => {
          hole.classList.remove("active");
        });

        // Show game over modal
        finalScoreDisplay.textContent = gameState.score;
        missesSummaryDisplay.textContent = `Misses: ${gameState.misses}`;
        overlay.classList.add("show");
        gameOverModal.classList.add("show");

        startBtn.disabled = false;
        difficultySelect.disabled = false;
      }

      function resetGame() {
        gameState.isGameRunning = false;
        gameState.score = 0;
        gameState.timeLeft = GAME_DURATION;
        gameState.misses = 0;

        clearInterval(timerId);
        clearTimeout(moleShowTimer);

        scoreDisplay.textContent = gameState.score;
        timerDisplay.textContent = gameState.timeLeft;
        missesDisplay.textContent = gameState.misses;

        document.querySelectorAll(".hole").forEach((hole) => {
          hole.classList.remove("active");
        });

        startBtn.disabled = false;
        difficultySelect.disabled = false;

        overlay.classList.remove("show");
        gameOverModal.classList.remove("show");
      }

      // Event listeners
      startBtn.addEventListener("click", startGame);
      resetBtn.addEventListener("click", resetGame);
      playAgainBtn.addEventListener("click", () => {
        resetGame();
        startGame();
      });

      // Initialize
      createHoles();
    </script>
  </body>
</html>
